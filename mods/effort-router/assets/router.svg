  <text x="40" y="372" class="ink b" font-size="17">your message</text>
  <text x="196" y="238" class="mute" font-size="15">slash command, notification or empty prompt</text>
  <text x="334" y="267" class="ink" font-size="15">passed through as is, mode unchanged</text>
  <text x="176" y="456" class="ink b" font-size="17">pinned</text>
  <text x="176" y="478" class="mute mono" font-size="14">/route chat · /route impl</text>
  <text x="176" y="499" class="mute" font-size="15">the pin picks the line</text>
  <text x="412" y="456" class="ink b" font-size="17">bare approval, in impl</text>
  <text x="412" y="478" class="mute mono" font-size="14">ok · vas-y · go ahead</text>
  <text x="412" y="499" class="mute" font-size="15">stays on impl</text>
  <text x="570" y="404" class="mute" font-size="14" text-anchor="middle" font-style="italic">no classifier call</text>
  <text x="812" y="306" class="mute" font-size="14" text-anchor="middle">switch</text>
  <text x="904" y="296" class="ink b" font-size="16">The switch stays where it was</text>
  <text x="904" y="319" class="mute" font-size="15">if the answer is below 0.6,</text>
  <text x="904" y="340" class="mute" font-size="15">takes over 6 s, or fails.</text>
  <text x="904" y="366" class="mute" font-size="15">A new session starts set to impl.</text>
  <text x="1158" y="180" font-size="16" text-anchor="end"><tspan class="chat b" font-size="22">chat</tspan><tspan class="mute" dx="10">main loop at low effort</tspan></text>
  <text x="1158" y="440" font-size="16" text-anchor="end"><tspan class="impl b" font-size="22">impl</tspan><tspan class="mute" dx="10">main loop at high effort</tspan></text>
  <text x="970" y="504" class="mute" font-size="15" text-anchor="end">the orchestrator hands off the change</text>
  <text x="970" y="525" class="mute" font-size="15" text-anchor="end">and reviews it when it comes back</text>
  <text x="1146" y="574" class="ink b" font-size="17" text-anchor="end">implementer agent</text>
  <text x="1146" y="596" class="mute mono" font-size="14" text-anchor="end">opus · high effort</text>

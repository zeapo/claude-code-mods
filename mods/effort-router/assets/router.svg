      .mute { fill: #9198a1; }
      .chat { fill: #2dd4bf; }
      .impl { fill: #b49cfc; }
      .on { fill: #0d1117; }
      .sleepers { stroke: #2f363e; }
      .rail { stroke: #8b949e; }
      .rail-chat { stroke: #2dd4bf; }
      .rail-impl { stroke: #b49cfc; }
      .gauge { stroke: #151b23; }
      .box { fill: #0d1117; stroke: #4f5964; }
      .panel { fill: #0d1117; stroke: #3d444d; }
      .rule { stroke: #3d444d; }
      .pill { fill: #0d1117; stroke: #8b949e; }
      .stop { fill: #151b23; }
    }
    /* Motion is decoration: the still drawing says everything. */
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .still { display: none; }
    }
  </style>

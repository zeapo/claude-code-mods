  <text x="64" y="654" class="mute b" font-size="13" letter-spacing="1.5">THE BAND ABOVE THE PROMPT</text>
  <text x="1136" y="654" class="mute" font-size="14" text-anchor="end">how the last message was routed</text>
  <path d="M64 668 H1136" class="rule" stroke-width="1"/>
  <text x="64" y="698" class="mono" font-size="16" xml:space="preserve"><tspan class="chat b">● chat</tspan><tspan class="mute"> · low · </tspan><tspan class="mute">haiku: chat 0.92 in 1840 ms</tspan></text>
  <text x="1136" y="698" class="mute" font-size="14" text-anchor="end">the classifier sent it to chat</text>
  <text x="64" y="726" class="mono" font-size="16" xml:space="preserve"><tspan class="impl b">● impl</tspan><tspan class="mute"> · high · </tspan><tspan class="ink">haiku unsure: chat 0.55 &lt; 0.6, kept impl</tspan></text>
  <text x="1136" y="726" class="mute" font-size="14" text-anchor="end">unsure: the switch stayed on impl</text>
  <text x="64" y="754" class="mono" font-size="16" xml:space="preserve"><tspan class="impl b">● impl</tspan><tspan class="mute"> · high · </tspan><tspan class="ink">classifier timed out (6000 ms), kept impl</tspan></text>
  <text x="1136" y="754" class="mute" font-size="14" text-anchor="end">too slow: the switch stayed on impl</text>
  <text x="48" y="800" class="mute" font-size="14">Only the main loop is routed, on a session whose model matches <tspan class="mono">routed_model</tspan>. Subagents keep their own effort, and so does an effort raised past high.</text>

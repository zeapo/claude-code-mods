    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-weight: 600; }

    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .ink { fill: #1f2328; }
    .mute { fill: #59636e; }
    .chat { fill: #0b7a75; }
    .impl { fill: #7c3aed; }
    .on { fill: #ffffff; }
    .sleepers { stroke: #d1d9e0; }
    .rail { stroke: #6e7781; }
    .rail-chat { stroke: #0b7a75; }
    .rail-impl { stroke: #7c3aed; }
    .gauge { stroke: #f6f8fa; }
    .box { fill: #ffffff; stroke: #afb8c1; }
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    .rule { stroke: #d1d9e0; }
    .pill { fill: #ffffff; stroke: #6e7781; }
    .stop { fill: #f6f8fa; }


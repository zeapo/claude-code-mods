<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">effort-router: how a message is routed</title>
  <desc id="desc">A railway diagram. A message enters from the left. Slash commands, notifications and empty prompts leave on a spur, untouched. A pinned mode or a bare approval while in impl takes a bypass straight to the switch, with no classifier call. Any other message stops at the classifier, a haiku model at low effort that answers in about two to three seconds with chat or impl and a confidence; at 0.6 or more it throws the switch. An answer below 0.6, a timeout after 6 seconds or a failure leaves the switch where it was, and a new session starts set to impl. The chat line runs the main loop at low effort. The impl line runs it at high effort as an orchestrator, which hands the change to an implementer agent on opus at high effort down a siding and reviews it when it comes back. A board at the bottom shows the band above the prompt: the mode and how the last message was routed.</desc>
